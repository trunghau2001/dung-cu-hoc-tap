<script>
"use strict";
/* ============================================================
   TIỆN ÍCH NGÀY THÁNG (dùng giờ địa phương, tránh lệch UTC)
   ============================================================ */
const DOW_LABEL = ["CN", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
const DOW_SHORT = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];

function parseDate(s) { // "YYYY-MM-DD" -> Date (local midnight)
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtISO(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function fmtVN(d) { // 25/08/2026
  const p = n => String(n).padStart(2, "0");
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear();
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function todayLocal() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

/* ============================================================
   DỮ LIỆU: CONFIG gốc trong file + bản nháp localStorage
   ============================================================ */
const DRAFT_KEY = "llcdht_draft_v1";
const AUTH_KEY = "llcdht_admin";
const THEME_KEY = "llcdht_theme";
const TOKEN_KEY = "llcdht_gh_token";
// Thông tin repo để đẩy tự động (không phải bí mật). Token mới là thứ bí mật, lưu riêng.
const GH = { owner: "trunghau2001", repo: "dung-cu-hoc-tap", branch: "main", path: "index.html" };

function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.students) || !d.startDate || !Array.isArray(d.schoolDays)) return null;
    return d;
  } catch (e) { return null; }
}
function saveDraft(cfg) {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(cfg)); } catch (e) { /* bỏ qua */ }
}
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* bỏ qua */ }
}
function baseConfig() { // bản sao sâu của CONFIG trong file
  return JSON.parse(JSON.stringify({
    startDate: CONFIG.startDate,
    schoolDays: CONFIG.schoolDays,
    disabledDates: CONFIG.disabledDates,
    extraDates: CONFIG.extraDates || [],
    students: CONFIG.students
  }));
}
// Chuẩn hóa: bảo đảm đủ trường & tương thích bản nháp cũ (done -> count)
function normalizeCfg(cfg) {
  if (!Array.isArray(cfg.schoolDays)) cfg.schoolDays = [];
  if (!Array.isArray(cfg.disabledDates)) cfg.disabledDates = [];
  if (!Array.isArray(cfg.extraDates)) cfg.extraDates = [];
  cfg.students = (cfg.students || []).map(s => ({
    name: s.name,
    count: typeof s.count === "number" ? Math.max(0, s.count | 0) : (s.done ? 1 : 0)
  }));
  return cfg;
}
function activeConfig() { return normalizeCfg(loadDraft() || baseConfig()); }
function hasDraft() { return loadDraft() !== null; }

/* ============================================================
   LOGIC PHÂN CÔNG
   Buổi học thực tế thứ n (bỏ qua ngày nghỉ) -> người thứ n
   trong hàng đợi: [các bạn CHƯA đợt 1] + vòng lặp cả lớp.
   ============================================================ */
function isSchoolSession(cfg, d) { // d là Date; có buổi học thật sự
  const iso = fmtISO(d);
  if (cfg.disabledDates.includes(iso)) return false;         // ngày nghỉ luôn thắng
  return cfg.schoolDays.includes(d.getDay())                  // thứ có học cố định
      || (cfg.extraDates || []).includes(iso);                // hoặc ngày học bù
}
// Xếp lịch tự cân bằng: mỗi buổi giao cho bạn có "số lần đã lấy" thấp nhất
// (đồng hạng thì theo thứ tự danh sách). Người đã lấy nhiều lần được miễn cho tới khi
// mọi người đuổi kịp. Trả về mảng { idx, level } cho các buổi 1..upto.
function buildAssignments(cfg, upto) {
  const n = cfg.students.length;
  const out = [];
  if (n === 0) return out;
  const counts = cfg.students.map(s => Math.max(0, s.count | 0));
  for (let k = 0; k < upto; k++) {
    let mi = 0;
    for (let i = 1; i < n; i++) if (counts[i] < counts[mi]) mi = i;
    counts[mi]++;
    out.push({ idx: mi, level: counts[mi] });
  }
  return out;
}
function personForSession(cfg, n) { // n >= 1
  if (cfg.students.length === 0 || n < 1) return { name: "—", tag: "", cls: "round-n" };
  const a = buildAssignments(cfg, n);
  const { idx, level } = a[n - 1];
  const s = cfg.students[idx];
  if (level === 1) return { name: s.name, tag: "Đợt 1", cls: "round-1" };
  return { name: s.name, tag: "Vòng " + level, cls: "round-n" };
}
// Trả về số thứ tự buổi học của ngày d (1-based), hoặc null nếu d không phải buổi học
function sessionNumberOf(cfg, d) {
  const start = parseDate(cfg.startDate);
  if (d < start) return null;
  if (!isSchoolSession(cfg, d)) return null;
  let n = 0;
  for (let cur = new Date(start); cur <= d; cur = addDays(cur, 1)) {
    if (isSchoolSession(cfg, cur)) n++;
  }
  return n;
}
// Danh sách `count` buổi học kể từ ngày fromDate (gồm cả fromDate nếu là buổi học)
function upcomingSessions(cfg, fromDate, count) {
  const out = [];
  const start = parseDate(cfg.startDate);
  let cur = fromDate < start ? new Date(start) : new Date(fromDate);
  // đếm số buổi trước cur để biết đang ở buổi thứ mấy
  let n = 0;
  for (let d = new Date(start); d < cur; d = addDays(d, 1)) {
    if (isSchoolSession(cfg, d)) n++;
  }
  let guard = 0;
  while (out.length < count && guard < 5000) {
    if (isSchoolSession(cfg, cur)) {
      n++;
      out.push({ date: new Date(cur), n, person: personForSession(cfg, n) });
    }
    cur = addDays(cur, 1);
    guard++;
  }
  return out;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
let currentTab = "today";
function switchTab(t) {
  currentTab = t;
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + t).classList.add("active");
  document.getElementById("tabbtn-" + t).classList.add("active");
  renderAll();
}
function renderAll() {
  const cfg = activeConfig();
  document.getElementById("draftBanner").classList.toggle("show", hasDraft());
  document.getElementById("subTitle").textContent =
    "Áp dụng từ " + fmtVN(parseDate(cfg.startDate));
  if (currentTab === "today") renderToday(cfg);
  else if (currentTab === "week") renderWeek(cfg);
  else if (currentTab === "all") renderAllSchedule(cfg);
  else renderAdmin(cfg);
}

/* ---------- Tab Hôm nay ---------- */
function renderToday(cfg) {
  const today = todayLocal();
  const iso = fmtISO(today);
  const n = sessionNumberOf(cfg, today);
  let html = "";

  if (n !== null) {
    const p = personForSession(cfg, n);
    html += `<div class="card">
      <h2>Hôm nay trực — ${DOW_LABEL[today.getDay()]}, ${fmtVN(today)}</h2>
      <div class="today-name">${esc(p.name)}</div>
      <span class="today-meta">Buổi thứ ${n} · ${esc(p.tag)}</span>
    </div>`;
  } else {
    let reason;
    if (today < parseDate(cfg.startDate)) reason = "Lịch bắt đầu từ " + fmtVN(parseDate(cfg.startDate)) + ".";
    else if (cfg.disabledDates.includes(iso)) reason = "Hôm nay là <b style='color:var(--danger)'>ngày nghỉ</b>.";
    else reason = "Hôm nay không có buổi học.";
    html += `<div class="card">
      <h2>${DOW_LABEL[today.getDay()]}, ${fmtVN(today)}</h2>
      <div class="no-class">${reason}</div>
    </div>`;
  }

  // Buổi kế tiếp (sau hôm nay)
  const next = upcomingSessions(cfg, addDays(today, 1), 1)[0];
  if (next) {
    html += `<div class="card">
      <h2>Buổi kế tiếp — ${DOW_LABEL[next.date.getDay()]}, ${fmtVN(next.date)}</h2>
      <div class="next-name">${esc(next.person.name)}</div>
      <span class="round-tag ${next.person.cls}" style="margin-top:6px;display:inline-block">Buổi thứ ${next.n} · ${esc(next.person.tag)}</span>
    </div>`;
  }
  document.getElementById("tab-today").innerHTML = html;
}

/* ---------- Tab Tuần này ---------- */
function renderWeek(cfg) {
  const today = todayLocal();
  // Tuần bắt đầu Thứ 2
  const monday = addDays(today, -((today.getDay() + 6) % 7));
  const start = parseDate(cfg.startDate);
  let rows = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const dow = d.getDay();
    if (!cfg.schoolDays.includes(dow)) continue; // chỉ hiện các thứ có buổi học
    const iso = fmtISO(d);
    const isToday = iso === fmtISO(today);
    const isOff = cfg.disabledDates.includes(iso);
    let who;
    if (d < start) {
      who = `<span class="na">Chưa áp dụng lịch</span>`;
    } else if (isOff) {
      who = `<span class="off">Nghỉ học</span> <span class="off-badge">Nghỉ</span>`;
    } else {
      const n = sessionNumberOf(cfg, d);
      const p = personForSession(cfg, n);
      who = `${esc(p.name)} <span class="round-tag ${p.cls}">${esc(p.tag)}</span>`;
    }
    rows += `<div class="week-row${isToday ? " today-row" : ""}">
      <div class="day-badge">${DOW_SHORT[dow]}<span class="day-date">${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}</span></div>
      <div class="who">${who}</div>
      ${isToday ? '<span class="today-tag">HÔM NAY</span>' : ""}
    </div>`;
  }
  document.getElementById("tab-week").innerHTML = `<div class="card">
    <h2>Tuần ${fmtVN(monday)} → ${fmtVN(addDays(monday, 6))}</h2>
    ${rows || '<div class="na" style="color:var(--muted)">Tuần này không có buổi học nào.</div>'}
  </div>`;
}

/* ---------- Tab Toàn bộ lịch ---------- */
function renderAllSchedule(cfg) {
  const today = todayLocal();
  const list = upcomingSessions(cfg, today, 50); // ẩn buổi đã qua, hiện 50 buổi tới
  const todayISO = fmtISO(today);
  let rows = list.map(s => `<tr class="${fmtISO(s.date) === todayISO ? "hl" : ""}">
      <td>${fmtVN(s.date)}<br><span class="dow">${DOW_LABEL[s.date.getDay()]}</span></td>
      <td><b>${esc(s.person.name)}</b></td>
      <td><span class="round-tag ${s.person.cls}">${esc(s.person.tag)}</span></td>

  document.getElementById("tab-all").innerHTML = `<div class="card">
    <div class="table-scroll"><table>
      <thead><tr><th>Ngày</th><th>Bạn trực</th><th>Đợt / Vòng</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function isAdmin() {
  try { return sessionStorage.getItem(AUTH_KEY) === "1"; } catch (e) { return false; }
}
// Băm SHA-256 có muối — dùng cả khi đăng nhập lẫn khi tạo mật khẩu mới (gọi từ Console)
async function hashPassword(pw) {
  const data = new TextEncoder().encode("llcdht:" + pw);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function tryLogin() {
  const v = document.getElementById("pwInput").value;
  let hash;
  try { hash = await hashPassword(v); }
  catch (e) {
    // crypto.subtle chỉ chạy trên https/localhost/file — báo rõ thay vì im lặng
    const err = document.getElementById("pwErr");
    err.textContent = "Trình duyệt không hỗ trợ mã hóa ở trang này (cần mở qua https).";
    err.style.display = "block";
    return;
  }
  if (hash === CONFIG.passwordHash) {
    try { sessionStorage.setItem(AUTH_KEY, "1"); } catch (e) { /* vẫn cho vào trong phiên này */ }
    window._adminFallback = true;
    renderAll();
  } else {
    document.getElementById("pwErr").style.display = "block";
  }
}
function logoutAdmin() {
  try { sessionStorage.removeItem(AUTH_KEY); } catch (e) { }
  window._adminFallback = false;
  renderAll();
}

/* ---------- Hành động quản lý (mỗi hành động = sửa nháp + render lại) ---------- */
function mutate(fn) {
  const cfg = activeConfig();
  fn(cfg);
  saveDraft(cfg);
  renderAll();
}
function toggleOff(iso) {
  mutate(cfg => {
    const i = cfg.disabledDates.indexOf(iso);
    if (i >= 0) cfg.disabledDates.splice(i, 1); else cfg.disabledDates.push(iso);
    cfg.disabledDates.sort();
  });
}
function addCustomOff() {
  const v = document.getElementById("customOffDate").value;
  if (!v) return;
  mutate(cfg => {
    // Thêm ngày nghỉ thì gỡ khỏi ngày học bù (nếu có) cho khỏi mâu thuẫn
    const e = cfg.extraDates.indexOf(v); if (e >= 0) cfg.extraDates.splice(e, 1);
    if (!cfg.disabledDates.includes(v)) { cfg.disabledDates.push(v); cfg.disabledDates.sort(); }
  });
}
function toggleExtra(iso) {
  mutate(cfg => {
    const i = cfg.extraDates.indexOf(iso);
    if (i >= 0) cfg.extraDates.splice(i, 1);
    else { cfg.extraDates.push(iso); cfg.extraDates.sort(); }
  });
}
function addExtraDate() {
  const v = document.getElementById("customExtraDate").value;
  if (!v) return;
  mutate(cfg => {
    // Ngày học bù thì không thể đồng thời là ngày nghỉ
    const o = cfg.disabledDates.indexOf(v); if (o >= 0) cfg.disabledDates.splice(o, 1);
    if (!cfg.extraDates.includes(v)) { cfg.extraDates.push(v); cfg.extraDates.sort(); }
  });
}
function changeStartDate(v) {
  if (!v) return;
  mutate(cfg => { cfg.startDate = v; });
}
function toggleSchoolDay(dw) {
  mutate(cfg => {
    const i = cfg.schoolDays.indexOf(dw);
    if (i >= 0) cfg.schoolDays.splice(i, 1); else { cfg.schoolDays.push(dw); cfg.schoolDays.sort(); }
  });
}
function editStudentName(i, v) {
  const name = v.trim();
  if (!name) { renderAll(); return; }
  mutate(cfg => { cfg.students[i].name = name; });
}
function changeCount(i, delta) {
  mutate(cfg => { cfg.students[i].count = Math.max(0, (cfg.students[i].count | 0) + delta); });
}
function moveStudent(i, dir) {
  mutate(cfg => {
    const j = i + dir;
    if (j < 0 || j >= cfg.students.length) return;
    [cfg.students[i], cfg.students[j]] = [cfg.students[j], cfg.students[i]];
  });
}
function removeStudent(i) {
  const cfg = activeConfig();
  if (!confirm("Xóa «" + cfg.students[i].name + "» khỏi danh sách?")) return;
  mutate(c => { c.students.splice(i, 1); });
}
function addStudent() {
  const name = prompt("Tên bạn mới:");
  if (!name || !name.trim()) return;
  mutate(cfg => { cfg.students.push({ name: name.trim(), count: 0 }); });
}
function discardDraft() {
  if (!confirm("Bỏ toàn bộ bản nháp, quay về dữ liệu gốc trong file?")) return;
  clearDraft();
  renderAll();
}

/* ---------- Sinh & sao chép đoạn CONFIG ---------- */
function generateConfigBlock() {
  const cfg = activeConfig();
  const stu = cfg.students.map(s =>
    `    { name: ${JSON.stringify(s.name)}, count: ${Math.max(0, s.count | 0)} }`
  ).join(",\n");
  return `// ===== CONFIG START =====
const CONFIG = {
  // Mật khẩu KHÔNG lưu dạng chữ — chỉ lưu mã băm SHA-256 của chuỗi "llcdht:<mật khẩu>".
  // Muốn đổi mật khẩu: mở Console trình duyệt (F12) trên trang này rồi chạy:
  //   hashPassword("mật_khẩu_mới").then(console.log)
  // và dán kết quả vào đây.
  passwordHash: ${JSON.stringify(CONFIG.passwordHash)},
  startDate: ${JSON.stringify(cfg.startDate)},
  // Ngày trong tuần có buổi học: 0=CN, 1=T2, 2=T3, 3=T4, 4=T5, 5=T6, 6=T7
  schoolDays: [${cfg.schoolDays.join(", ")}],
  // Danh sách ngày nghỉ (không học), định dạng "YYYY-MM-DD"
  disabledDates: [${cfg.disabledDates.map(x => JSON.stringify(x)).join(", ")}],
  // Ngày học bù: bật một ngày cụ thể (kể cả cuối tuần) thành buổi học, "YYYY-MM-DD"
  extraDates: [${cfg.extraDates.map(x => JSON.stringify(x)).join(", ")}],
  // count = số lần bạn đó ĐÃ đi lấy dụng cụ. Ai có count thấp nhất sẽ được xếp trực trước
  // (tự cân bằng: người đã lấy nhiều lần sẽ được miễn cho tới khi người khác đuổi kịp).
  students: [
${stu}
  ]
};
// ===== CONFIG END =====`;
}
function copyConfig() {
  const text = generateConfigBlock();
  const showOk = () => {
    const m = document.getElementById("copiedMsg");
    if (m) { m.style.display = "block"; setTimeout(() => { m.style.display = "none"; }, 4000); }
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showOk(); }
    catch (e) { prompt("Sao chép thủ công đoạn dưới:", text); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showOk, fallback);
  } else fallback();
}

/* ---------- Đẩy tự động lên GitHub bằng token (token chỉ nằm trong máy admin) ---------- */
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
function saveToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { } }
function saveTokenFromInput() {
  const inp = document.getElementById("ghToken");
  const v = inp ? inp.value.trim() : "";
  if (!v) { alert("Chưa nhập token."); return; }
  saveToken(v);
  if (inp) inp.value = "";
  renderAll();
}
function clearToken() {
  if (!confirm("Xóa token GitHub khỏi trình duyệt này?")) return;
  saveToken("");
  renderAll();
}
function setPushStatus(msg, ok) {
  const el = document.getElementById("pushStatus");
  if (!el) return;
  el.textContent = msg;
  el.className = "push-status" + (ok === true ? " ok" : ok === false ? " err" : "");
  el.style.display = "block";
}
// UTF-8 <-> base64 an toàn cho tiếng Việt
function b64Encode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64Decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, "")))); }

async function pushToGitHub() {
  const inp = document.getElementById("ghToken");
  if (inp && inp.value.trim()) saveToken(inp.value.trim());
  const token = getToken();
  if (!token) { setPushStatus("✗ Chưa có token. Dán token GitHub vào ô trên rồi thử lại.", false); return; }
  const btn = document.getElementById("pushBtn");
  if (btn) btn.disabled = true;
  try {
    setPushStatus("Đang đọc file hiện tại trên GitHub…");
    const api = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
    const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
    const getRes = await fetch(api + "?ref=" + GH.branch, { headers });
    if (getRes.status === 401) throw new Error("Token sai hoặc hết hạn (401).");
    if (getRes.status === 404) throw new Error("Không thấy repo/file — kiểm tra token có quyền repo này (404).");
    if (!getRes.ok) throw new Error("Không đọc được file (HTTP " + getRes.status + ").");
    const meta = await getRes.json();
    const currentText = b64Decode(meta.content || "");
    const startMark = "// ===== CONFIG START =====";
    const endMark = "// ===== CONFIG END =====";
    const si = currentText.indexOf(startMark);
    const ei = currentText.indexOf(endMark);
    if (si < 0 || ei < 0) throw new Error("Không tìm thấy mốc CONFIG trong file trên GitHub.");
    const newText = currentText.slice(0, si) + generateConfigBlock() + currentText.slice(ei + endMark.length);
    if (newText === currentText) { setPushStatus("Không có gì thay đổi so với file trên GitHub.", true); return; }
    setPushStatus("Đang đẩy thay đổi lên GitHub…");
    const putRes = await fetch(api, {
      method: "PUT",
      headers: { ...headers, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "Cập nhật lịch từ trang Quản lý",
        content: b64Encode(newText),
        sha: meta.sha,
        branch: GH.branch
      })
    });
    if (!putRes.ok) {
      let m = ""; try { m = (await putRes.json()).message || ""; } catch (e) { }
      throw new Error("Đẩy thất bại (HTTP " + putRes.status + "). " + m);
    }
    setPushStatus("✓ Đã đẩy lên GitHub! Chờ ~1 phút để cả lớp thấy lịch mới. Có thể bấm «Bỏ bản nháp» sau khi deploy xong.", true);
  } catch (err) {
    setPushStatus("✗ " + (err && err.message ? err.message : "Lỗi không rõ."), false);
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* ============================================================
   GIAO DIỆN SÁNG / TỐI THEO GIỜ (auto: 6h–18h sáng, còn lại tối)
   ============================================================ */
function getThemePref() {
  try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; }
}
function applyTheme() {
  const pref = getThemePref();
  let dark;
  if (pref === "light") dark = false;
  else if (pref === "dark") dark = true;
  else { const h = new Date().getHours(); dark = (h < 6 || h >= 18); }
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = pref === "auto" ? "🕐 Tự động" : (pref === "light" ? "☀️ Sáng" : "🌙 Tối");
}
function cycleTheme() {
  const order = ["auto", "light", "dark"];
  const next = order[(order.indexOf(getThemePref()) + 1) % 3];
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { }
  applyTheme();
}
setInterval(applyTheme, 5 * 60 * 1000); // giờ đổi thì tự chuyển theme

/* ============================================================ */
applyTheme();
renderAll();
// Qua nửa đêm / mở lại tab thì tự cập nhật
document.addEventListener("visibilitychange", () => { if (!document.hidden) { applyTheme(); renderAll(); } });
</script>
