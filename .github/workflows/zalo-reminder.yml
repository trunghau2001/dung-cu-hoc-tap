name: Nhắc trực Zalo (2h sáng · ĐANG TEST nhóm Tây Du Kí)

# HƯỚNG SERVER: chạy trên máy chủ của GitHub, không cần Mac bật.
# LƯU Ý RỦI RO: zca-js không chính thức; đăng nhập từ IP trung tâm dữ liệu của GitHub
# có thể bị Zalo chặn/đăng xuất. Nếu bị, dùng hướng local (launchd) làm chính.

on:
  schedule:
    # Chạy MỖI GIỜ (cron hàng giờ ổn định hơn cron 1 lần/ngày, vốn hay bị GitHub bỏ nhịp/chạy trễ).
    # send-once.js chỉ thật sự gửi khi giờ VN = 16h (EXPECT_HOUR bên dưới), nên chỉ gửi 1 lần/ngày,
    # và KHÔNG gửi sai giờ dù GitHub chạy trễ.
    - cron: "0 * * * *"
  workflow_dispatch:       # cho phép bấm chạy tay để test
    inputs:
      mode:
        description: "Chế độ chạy tay"
        type: choice
        default: dry-run
        options:
          - dry-run     # chỉ in tin của HÔM NAY, không gửi (không cần nhóm)
          - test-send   # ép gửi [TEST] vào nhóm test bên dưới (kiểm chứng server)
          - real        # gửi thật như lịch (chỉ gửi nếu hôm nay là buổi học)
      test_group_id:
        description: "ID nhóm test (dùng khi mode=test-send)"
        default: "3191333390522945563"   # nhóm Tây Du Kí

concurrency:
  group: zalo-reminder
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài thư viện
        working-directory: bot
        run: npm install

      - name: Chạy bot
        working-directory: bot
        env:
          ZALO_CRED: ${{ secrets.ZALO_CRED }}
          # ⚠️ ĐANG TEST: KHÔNG truyền ZALO_GROUP_ID để config.js (Tây Du Kí) làm chủ đích gửi,
          # tránh mọi secret cũ vô tình trỏ về Xóm 8. Khi chạy thật: bỏ chú thích dòng dưới
          # (và đặt secret = id Xóm 8) hoặc đổi GROUP_ID trong config.js về Xóm 8.
          # ZALO_GROUP_ID: ${{ secrets.ZALO_GROUP_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="real"; fi   # chạy theo lịch (schedule) -> gửi thật
          # Chạy theo lịch: chốt chỉ gửi đúng giờ VN = EXPECT_HOUR (chống GitHub chạy trễ sai giờ).
          # Chạy tay: KHÔNG chốt giờ, gửi ngay để tiện test.
          # ⏱️ TẠM: đặt 9 + nội dung "hí anh em" để test đo độ trễ GitHub (gửi ~9h sáng vào Tây Du Kí).
          #    Sau khi test xong: đổi EXPECT_HOUR về 2 và BỎ dòng OVERRIDE_TEXT.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            export EXPECT_HOUR=9
            export OVERRIDE_TEXT="hí anh em"
          fi
          echo "MODE = $MODE ; EXPECT_HOUR = ${EXPECT_HOUR:-<không đặt>}"
          case "$MODE" in
            dry-run)   node send-once.js --dry-run ;;
            test-send) node send-test.js "${{ github.event.inputs.test_group_id }}" ;;
            real)      node send-once.js ;;
          esac
