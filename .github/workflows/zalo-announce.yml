name: Thông báo tự động Zalo (hàng giờ)

# HƯỚNG SERVER: chạy mỗi đầu giờ trên máy chủ GitHub (không cần Mac bật).
# Đọc danh sách `announcements` trong CONFIG trên trang, gửi những thông báo có
# giờ trùng giờ VN hiện tại. Vì VN = UTC+7 cố định, mỗi mốc ":00" của UTC cũng là
# ":00" của giờ VN, nên cron theo giờ UTC vẫn khớp giờ tròn VN.
# LƯU Ý: GitHub có thể chạy trễ vài phút và đôi khi bỏ nhịp lúc tải cao.

on:
  schedule:
    - cron: "0 * * * *"   # mỗi đầu giờ (phút :00)
  workflow_dispatch:       # bấm chạy tay để test
    inputs:
      dry_run:
        description: "Chỉ in ra, không gửi thật?"
        type: boolean
        default: true
      hour:
        description: "Giả lập giờ VN (0-23), để trống = giờ hiện tại"
        default: ""

concurrency:
  group: zalo-announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài thư viện
        working-directory: bot
        run: npm install

      - name: Gửi thông báo tới hạn
        working-directory: bot
        env:
          ZALO_CRED: ${{ secrets.ZALO_CRED }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.hour }}" ]; then ARGS="$ARGS --hour ${{ github.event.inputs.hour }}"; fi
          echo "ARGS = $ARGS"
          node send-announcements.js $ARGS
