name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép chạy tay từ tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cấu hình Pages (tự bật nếu chưa bật)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Đóng gói trang tĩnh
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
